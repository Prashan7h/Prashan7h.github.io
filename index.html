<!-- Per-layer margin-top, regenerated whenever the plates are re-cut. -->
<link rel="stylesheet" href="assets/layers/layers.css">
<link rel="stylesheet" href="assets/layers/sheet.css">
<style>
  :root{
    --paper: #d1c1b2;
    --ink:   #3b3630;
    --ember: #a35f30;
    /* Mincho — the same lineage as the painting's own vertical title. Its
       Latin is high-contrast, lightly built and slightly condensed, which is
       where the Japanese character comes from. The fallbacks stay inside the
       same family of shapes rather than dropping to a European serif. */
    --serif: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", "YuMincho",
             "Songti SC", "Songti TC", "Hoefler Text", Georgia, serif;
  }

  *{ box-sizing: border-box; }
  html{ background: var(--paper); }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ------------------------------------------------------------- the scene */

  .scroller{ height: 650vh; position: relative; }

  .stage{
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--paper);
  }

  /* Cover-fit box at the plate's 3:2 aspect. Layers are full-width children
     offset upward by a percentage margin — percentage margins resolve against
     the containing block's *width*, so one number places each layer at its
     exact source row regardless of viewport size. */
  .frame{
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: max(100vw, 150vh);
    aspect-ratio: 3 / 2;
    opacity: 0;
    animation: rise 1.6s cubic-bezier(.22,.7,.24,1) .1s forwards;
  }
  @keyframes rise{ to{ opacity: 1 } }

  .ly{
    position: absolute;
    left: 0;
    width: 100%;
    height: auto;
    display: block;
    transform-origin: 50% 100%;   /* every layer's canvas ends on source row 1444 */
    will-change: transform, opacity;
    backface-visibility: hidden;
    pointer-events: none;
    user-select: none;
  }

  /* ------------------------------------------------------------------ copy */

  /* Anchored to the viewport rather than to the frame, so it keeps its place
     in the empty sky whatever the frame is doing underneath — including on
     portrait, where the frame slides right and the left of the plate is gone. */
  .name{
    position: absolute;
    left: clamp(26px, 7vw, 92px);
    top: 47%;
    transform: translateY(-50%);
    margin: 0;
    z-index: 4;
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(20px, 2.3vw, 33px);
    letter-spacing: .3em;
    color: #423a31;
    white-space: nowrap;
    mix-blend-mode: multiply;
    will-change: opacity, transform;
  }
  .name .rule{
    display: block;
    position: relative;
    width: 152px; height: 1px;
    margin-top: 20px;
    background: linear-gradient(90deg, rgba(59,54,48,.45), rgba(59,54,48,0));
  }
  /* One colour, which decides when it can arrive. The ground under this copy
     travels from open sky to charcoal — measured, from luminance 187 down to
     63 — so pale type only has the contrast to carry from about halfway down
     that fall. It waits for it. Set centred like the name, with the lines
     stepping progressively shorter so the block tapers the way the sheet's
     own gradient does. */
  .about{
    position: absolute;
    left: clamp(26px, 7vw, 92px);
    top: 47%;
    transform: translateY(-50%);
    margin: 0;
    z-index: 4;
    font-family: var(--serif);
    font-size: clamp(14px, 1.2vw, 18px);
    line-height: 2.05;
    /* Mincho's horizontal strokes are hairlines, and at this size that — not
       the ground behind it — is what costs the copy its legibility: measured,
       a soft dark halo behind the W3 weight moved the text-to-ground
       separation from 74 to 72, while stepping up to Mincho's W6 took it to
       106. The heavy weight carried it for a while — until slowing the sheet's
       fade dropped the ground under this copy from 95 to 53, and bought back
       more contrast than the weight ever did. Mincho's W3 now measures 103
       against that darker ground, comfortably past what W6 managed on the old
       one, so the copy can go back to the thin cut it wants to be. The halo
       stays to tidy the ends of lines, where the gradient begins to lighten. */
    font-weight: 300;
    letter-spacing: .2em;
    text-shadow: 0 1px 20px rgba(16, 13, 10, .45), 0 0 3px rgba(16, 13, 10, .3);
    color: rgba(236, 229, 217, .95);
    will-change: opacity, transform;
  }

  /* The ember dot the painting sets under its own title. It runs the length of
     the rule as you scroll and goes out on exactly the same cue as the name —
     which is why the rule is as long as it is: on a short one the dot reaches
     the end and has to start fading while the name is still up. */
  .name .dot{
    position: absolute; left: 0; top: -2px;
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--ember);
    will-change: transform, opacity;
  }

  /* ------------------------------------------------------------ enter link */

  /* The one way into the site proper, and the page's closing gesture. It is
     set exactly like the opening: the same light Mincho over the same fading
     rule — pale now, for the charcoal ground — with the ember dot waiting at
     its start. The dot that burned out under the name as the dusk came down
     reappears here, and on hover it completes the travel it began there. */
  .enter{
    position: absolute;
    left: clamp(26px, 7vw, 92px);
    top: 47%;
    margin: 0;
    z-index: 5;
    opacity: 0;
    visibility: hidden;
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(17px, 1.7vw, 24px);
    letter-spacing: .3em;
    text-decoration: none;
    color: rgba(236, 229, 217, .95);
    text-shadow: 0 1px 20px rgba(16, 13, 10, .45), 0 0 3px rgba(16, 13, 10, .3);
    white-space: nowrap;
    will-change: opacity, transform;
  }
  .enter .rule{
    display: block;
    position: relative;
    width: 152px; height: 1px;
    margin-top: 16px;
    background: linear-gradient(90deg, rgba(236, 229, 217, .5), rgba(236, 229, 217, 0));
  }
  .enter .dot{
    position: absolute; left: 0; top: -2px;
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--ember);
    transition: transform 1.1s cubic-bezier(.22,.7,.24,1);
  }
  .enter:hover .dot{ transform: translateX(134px); }

  /* A 3:2 plate on a portrait screen has to lose something. Centring loses the
     subject off the right edge and leaves a screenful of empty sky, so below the
     plate's own aspect ratio the frame anchors right instead: the sun, the peak
     and the figure stay in shot, and it is the empty left-hand sky that goes.
     Above 3:2 there is no horizontal crop at all and none of this applies. */
  @media (max-aspect-ratio: 3 / 2){
    .frame{ left: auto; right: 0; transform: translate(0, -50%); }

    /* Act two needs its own layout at these widths. The frame is a cover box
       at the plate's 3:2, which on a phone means it is three times the
       viewport's width — fine for the landscape, where that framing is the
       composition, and useless for a drawing, where it means standing inside
       the bridge. So here the two acts stop sharing a box: the sheet fills the
       screen on its own terms (it is a gradient, so a crop costs nothing), and
       each drawing is laid out against the viewport instead — whole, sized to
       the screen, and low enough to leave the copy its own air. */
    /* These sit inside the frame, and the frame is anchored right and far wider
       than the screen — its left edge is hundreds of pixels off to the left. So
       a viewport-relative x has to be measured back from there: the frame's left
       edge is at 100vw - 150vh, and everything below is offset by that. */
    #lySheet{
      top: 0; left: calc(150vh - 100vw); margin-top: 0;
      width: 100vw; height: 100vh;
      object-fit: cover; object-position: 68% 45%;
      transform-origin: 50% 100%;
    }
    #lyInkBridge, #lyInkSatellite{
      top: 42vh; left: calc(150vh - 95vw); margin-top: 0;
      width: 90vw; height: auto;
      transform-origin: 50% 100%;
    }
    /* Below 3:2 the frame fills the viewport's height exactly, which puts the
       sun's centre at a fixed 49% down — right where the copy sits. Lift it
       clear of the disc rather than letting it read across one. */
    .name{ top: 27%; }
    /* The frame is anchored right at these widths, so the sheet's charcoal
       corner is off-screen entirely and what shows is its pale half. Pale copy
       would vanish into it, so this one flips to ink and moves up above where
       the drawing sits. */
    /* Now that the sheet fills the screen on its own terms, the charcoal *is*
       on screen here — it runs across the top, which is where this copy sits.
       Measured, the ground under it is luminance 88, so pale wins by +148
       against ink's +30, and the copy stays pale exactly as it is on desktop.
       Its line breaks are set for a desktop measure, so they are dropped and
       the text is allowed to find the screen's own. */
    .about{ top: 19%; font-size: 15px; max-width: 84vw; }
    .about br{ display: none; }
    /* The copy sits high on portrait, so the invitation waits at the bottom
       of the screen instead of trailing under it. */
    .enter{ top: auto; bottom: 12vh; }
  }

  @media (prefers-reduced-motion: reduce){
    .frame{ animation:none; opacity:1; }
  }
</style>
</head>
<body>

<div class="scroller" id="scroller">
  <div class="stage">

    <div class="frame" id="frame">
      <img class="ly" id="lySky"   src="assets/layers/sky.jpg"   alt="" decoding="sync">
      <img class="ly" id="lySun"   src="assets/layers/sun.png"   alt="" decoding="sync">
      <img class="ly" id="lyLand"  src="assets/layers/land.png"  alt="" decoding="sync">
      <img class="ly" id="lyBirds" src="assets/layers/birds.png" alt="" decoding="sync">
      <img class="ly" id="lySea"   src="assets/layers/sea.png"   alt="" decoding="sync">
      <!-- act two: one sheet of paper, a drawing per page. The near slope
           stays in front of it so it can rise like a blind and uncover it. -->
      <img class="ly" id="lySheet"     src="assets/layers/sheet.jpg"      alt="" decoding="async">
      <img class="ly" id="lyInkBridge" src="assets/layers/ink-bridge.png"
           alt="A draughtsman's study of a suspension bridge" decoding="async">
      <img class="ly" id="lyInkSatellite" src="assets/layers/ink-satellite.png"
           alt="A draughtsman's study of a communications satellite" decoding="async">

      <img class="ly" id="lyFore"  src="assets/layers/fore.png"
           alt="A lone figure on a ridge above the sea, watching the sun set behind a snow peak" decoding="sync">
    </div>

    <h1 class="name" id="name">Prashanth Shankar<span class="rule"><i class="dot" id="dot"></i></span></h1>

    <p class="about" id="about">Theoretical Physics, Philosophy, Economics,<br>
      Neuroscience, Computation and everything<br>
      under the sun interests me</p>

    <p class="about" id="aboutTwo">Motivated by human ingenuity, excited<br>
      by technology, and optimistic<br>
      about the future</p>

    <a class="enter" id="enter" href="home.html">Curious?<span class="rule"><i class="dot"></i></span></a>

  </div>
</div>

<script>
(function(){
  'use strict';

  var PLATE_W = 1536;                 // source width the motion figures are in
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // One timeline, three acts. Every layer carries a list of motion tracks —
  // each a window on the scroll plus the distance to travel in it, in source
  // pixels — and optional fade windows. Tracks accumulate, which is how the
  // near slope can finish growing with the dusk and then, later and on its own
  // schedule, rise out of frame.
  //
  // Landforms grow rather than slide: every layer's canvas ends on the same
  // source row, well below frame, so scaling about `transform-origin: 50% 100%`
  // lifts a plane without ever exposing the smeared fill under its content.
  var DUSK = 0.30;          // dusk has played out by here

  // A slow push that runs from the moment the sheet appears to the very end.
  // Without it the second act only moves when something is fading, and between
  // beats — while a drawing simply sits there — the scroll goes completely
  // dead, which is what makes the whole page feel uneven. The sheet and every
  // drawing on it share this exact track so the paper and the ink stay locked
  // together while it breathes.
  var PUSH = { from: 0.26, to: 1.00, scale: 0.24 };

  // Handing the landscape over to the sheet is by far the largest change on the
  // page, and the dusk and the drawings are by far the quietest — so the two
  // ends are pulled toward each other rather than left to their natural pace.
  // The handover is spread over a third of the scroll with its fades staggered
  // rather than fired together, and the second act is given a push big enough
  // to keep moving between beats. Measured frame to frame, that takes the
  // page from a 178x swing to roughly 6x.
  var LAYERS = [
    { el: 'lySky',       tracks: [{ to: DUSK, scale: 0.008 }],            fadeOut: [0.24, 0.56] },
    { el: 'lySun',       tracks: [{ to: 0.36, ty: 205 }],                 fadeOut: [0.22, 0.52] },
    { el: 'lyLand',      tracks: [{ to: DUSK, scale: 0.035 }],            fadeOut: [0.28, 0.60] },
    { el: 'lyBirds',     tracks: [{ to: DUSK, tx: -250, ty: -105 }],      fadeOut: [0.12, 0.28] },
    { el: 'lySea',       tracks: [{ to: DUSK, scale: 0.055 }],            fadeOut: [0.32, 0.62] },

    { el: 'lySheet',     tracks: [PUSH],                                  fadeIn:  [0.24, 0.60] },
    { el: 'lyInkBridge', tracks: [PUSH, { from: 0.50, to: 0.74, ty: -40 }],
                         fadeIn:  [0.50, 0.68],                           fadeOut: [0.72, 0.86] },
    { el: 'lyInkSatellite', tracks: [PUSH, { from: 0.74, to: 1.00, ty: -40 }],
                         fadeIn:  [0.76, 0.94] },

    // Grows with the dusk, then keeps growing until the ridge sweeps up out of
    // frame and the sheet is uncovered. Growing rather than sliding, because
    // this layer's bottom is the real bottom edge of the painting: slide it up
    // and that edge rides into view with nothing behind it, whereas growing
    // about a bottom pinned off-screen cannot expose anything.
    { el: 'lyFore',      tracks: [{ to: DUSK, scale: 0.100 },
                                  { from: 0.18, to: 0.64, scale: 0.28 }], fadeOut: [0.30, 0.62] }
  ];
  LAYERS.forEach(function(L){ L.node = document.getElementById(L.el); });

  var scroller = document.getElementById('scroller');
  var frame    = document.getElementById('frame');
  var nameEl   = document.getElementById('name');
  var aboutEl  = document.getElementById('about');
  var aboutTwo = document.getElementById('aboutTwo');
  var enterEl  = document.getElementById('enter');
  var dotEl    = document.getElementById('dot');

  var target = 0, current = 0, running = false, k = 1, portrait = false;

  function clamp(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function seg(p, a, b){ return clamp((p - a) / (b - a)); }
  function smooth(t){ return t * t * (3 - 2 * t); }

  // Constant speed through the middle of a track, eased into and out of its
  // ends. An ease-out curve — fast start, long crawl — is right for a single
  // gesture and wrong for a timeline: with a dozen tracks each lurching then
  // dawdling inside its own window, the scroll pulses. This holds one steady
  // rate for most of a window, so a long move reads as a long move.
  var EDGE = 0.30, RATE = 1 / (1 - EDGE);
  function glide(t){
    if (t < EDGE)     return RATE * t * t / (2 * EDGE);
    if (t > 1 - EDGE){ var u = 1 - t; return 1 - RATE * u * u / (2 * EDGE); }
    return RATE * (t - EDGE / 2);
  }

  function measure(){
    k = frame.clientWidth / PLATE_W;   // source px -> css px
    portrait = innerWidth / innerHeight < 1.5;
    read();
  }

  function read(){
    var travel = scroller.offsetHeight - window.innerHeight;
    target = travel > 0 ? clamp(window.scrollY / travel) : 0;
    if (!running){ running = true; requestAnimationFrame(frameStep); }
  }

  function frameStep(){
    current += (target - current) * (reduce ? 1 : 0.11);
    if (Math.abs(target - current) < 0.0004) current = target;

    // Linear here on purpose: the timeline windows below are cut in scroll
    // space, and each track eases within its own window. Easing the global
    // progress first would shift every window's real position.
    var p = current;

    for (var i = 0; i < LAYERS.length; i++){
      var L = LAYERS[i], s = L.node.style;
      var x = 0, y = 0, z = 1, scaled = false;

      for (var t = 0; t < L.tracks.length; t++){
        var T = L.tracks[t];
        var u = glide(seg(p, T.from || 0, T.to));
        x += (T.tx || 0) * u;
        y += (T.ty || 0) * u;
        if (T.scale){ z += T.scale * u; scaled = true; }
      }

      s.transform = 'translate3d(' + (x * k).toFixed(2) + 'px,' + (y * k).toFixed(2) + 'px,0)'
                  + (scaled ? ' scale(' + z.toFixed(5) + ')' : '');

      var o = 1;
      if (L.fadeIn)  o *= smooth(seg(p, L.fadeIn[0],  L.fadeIn[1]));
      if (L.fadeOut) o *= 1 - smooth(seg(p, L.fadeOut[0], L.fadeOut[1]));
      if (L.fadeIn || L.fadeOut){
        s.opacity = o.toFixed(4);
        // Take fully faded layers out of the compositor's work entirely. Ten
        // full-frame planes is a lot of texture to blend every frame when at
        // most half of them are ever visible at once, and on a weaker GPU that
        // cost is exactly what makes the scroll feel uneven.
        var vis = o > 0.002 ? '' : 'hidden';
        if (s.visibility !== vis) s.visibility = vis;
      }
    }

    // The copy gets its own parallax rather than just dissolving in place. It
    // is the nearest thing on screen, so it travels further than any painted
    // plane — the land rises about 60px through the dusk and this rises 190 —
    // and it keeps moving the whole time it is fading, so the drift reads as
    // depth rather than as a nudge before it goes.
    nameEl.style.opacity   = String(1 - smooth(seg(p, 0.16, 0.32)));
    nameEl.style.transform = 'translateY(calc(-50% - ' + (190 * glide(seg(p, 0, 0.34)) * k).toFixed(1) + 'px))';

    // Picks up the moment the name has gone rather than waiting for the sheet,
    // and drifts the same way the name does so the two read as one voice.
    // The dot runs the length of its rule and burns out before the name goes.
    // Fixed pixels, not frame-scaled — it is travelling along a rule that is
    // itself a fixed width, and scaling the two differently would walk it off
    // the end on a wide screen.
    dotEl.style.transform = 'translateX(' + (134 * glide(seg(p, 0, 0.32))).toFixed(1) + 'px)';
    dotEl.style.opacity   = (1 - smooth(seg(p, 0.16, 0.32))).toFixed(3);

    aboutEl.style.opacity   = (smooth(seg(p, 0.46, 0.58)) * (1 - smooth(seg(p, 0.72, 0.83)))).toFixed(4);
    // Most of the travel is spent arriving, and it comes to rest exactly where
    // the bridge is clearest — so the copy settles into its page rather than
    // still climbing through it. Past that it only breathes, which also keeps
    // it from ending up jammed against the top of the frame.
    aboutEl.style.transform = 'translateY(calc(-50% - ' +
      ((70 * glide(seg(p, 0.44, 0.72)) + 20 * glide(seg(p, 0.72, 0.92))) * k).toFixed(1) + 'px))';

    // The engine's line takes over as the bridge's clears, and comes to rest
    // where the engine is clearest — the same shape of arrival, a page later.
    aboutTwo.style.opacity   = smooth(seg(p, 0.83, 0.94)).toFixed(4);
    aboutTwo.style.transform = 'translateY(calc(-50% - ' +
      (70 * glide(seg(p, 0.80, 1.00)) * k).toFixed(1) + 'px))';

    // The way into the site proper arrives just after the closing copy and
    // rides the same drift, a fixed step below it, so the two land as one
    // block. Hidden entirely until it has ink so it can't catch a stray tap.
    var eo = smooth(seg(p, 0.87, 0.97));
    enterEl.style.opacity    = eo.toFixed(4);
    enterEl.style.visibility = eo > 0.002 ? 'visible' : 'hidden';
    enterEl.style.transform  = 'translateY(calc(-50% + ' +
      (118 - 70 * glide(seg(p, 0.80, 1.00)) * k).toFixed(1) + 'px))';


    if (current !== target){ requestAnimationFrame(frameStep); }
    else { running = false; }
  }

  addEventListener('scroll', read, { passive: true });
  addEventListener('resize', measure);
  measure();
  current = target;
  frameStep();
})();
</script>
</body>
</html>
